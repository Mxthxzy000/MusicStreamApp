name: flashback_stream
description: Flashback Stream - Retro Music Streaming Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  go_router: ^13.0.0
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  audioplayers: ^6.0.0
  just_audio: ^0.9.36
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  intl: ^0.18.1
  image_picker: ^1.0.5
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - .env